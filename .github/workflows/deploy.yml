# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
name: Deploy

on:
  push:
    branches: ["dev", "ci-test"]

  workflow_dispatch:

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: ./.github/actions/rust

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          file: Dockerfile
          context: .
          tags: ghcr.io/liquorice-hq/open-intent-gate:${{ github.REF_NAME }}-${{ github.RUN_NUMBER }}

  update-versions:
    needs: [build-and-push]
    uses: Liquorice-HQ/infrastructure/.github/workflows/update-version.yml@main
    with:
      env: all
      parameter_name: open_intent_gate_version
      parameter_value: ${{ github.REF_NAME }}-${{ github.RUN_NUMBER }}
    secrets: inherit
